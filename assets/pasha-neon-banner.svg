<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0221"/>
      <stop offset="100%" stop-color="#1a0b3d"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6ec7"/>
      <stop offset="50%" stop-color="#ff9a56"/>
      <stop offset="100%" stop-color="#ffe66d"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff00e5"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="sunClip">
      <rect x="450" y="60" width="300" height="230"/>
    </clipPath>
  </defs>

  <style>
    @keyframes twinkle { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
    @keyframes pulseText { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
    @keyframes scan { 0% { transform: translateY(0); } 100% { transform: translateY(230px); } }
    @keyframes drift { 0% { transform: translateX(0); } 100% { transform: translateX(-40px); } }
    .star { animation: twinkle 2.4s ease-in-out infinite; }
    .title { animation: pulseText 2.6s ease-in-out infinite; }
    .scanline { animation: scan 4s linear infinite; }
    .grid-lines { animation: drift 3s linear infinite alternate; }
  </style>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <circle class="star" cx="80"   cy="40"  r="1.6" fill="#fff" style="animation-delay:.2s"/>
  <circle class="star" cx="160"  cy="90"  r="1.2" fill="#fff" style="animation-delay:.8s"/>
  <circle class="star" cx="1000" cy="50"  r="1.6" fill="#fff" style="animation-delay:.5s"/>
  <circle class="star" cx="1100" cy="100" r="1.2" fill="#fff" style="animation-delay:1.1s"/>
  <circle class="star" cx="250"  cy="30"  r="1.3" fill="#fff" style="animation-delay:1.4s"/>
  <circle class="star" cx="950"  cy="140" r="1.1" fill="#fff" style="animation-delay:.3s"/>
  <circle class="star" cx="60"   cy="150" r="1.1" fill="#fff" style="animation-delay:1.7s"/>
  <circle class="star" cx="1140" cy="170" r="1.3" fill="#fff" style="animation-delay:.9s"/>

  <g clip-path="url(#sunClip)">
    <circle cx="600" cy="170" r="95" fill="url(#sun)"/>
    <rect x="450" y="185" width="300" height="10" fill="#1a0b3d"/>
    <rect x="450" y="203" width="300" height="10" fill="#1a0b3d"/>
    <rect x="450" y="221" width="300" height="10" fill="#1a0b3d"/>
    <rect x="450" y="239" width="300" height="14" fill="#1a0b3d"/>
  </g>

  <g class="grid-lines" filter="url(#glow)" stroke="url(#grid)" stroke-width="1.5" opacity="0.85">
    <line x1="600" y1="180" x2="-100" y2="280"/>
    <line x1="600" y1="180" x2="50"   y2="280"/>
    <line x1="600" y1="180" x2="200"  y2="280"/>
    <line x1="600" y1="180" x2="350"  y2="280"/>
    <line x1="600" y1="180" x2="500"  y2="280"/>
    <line x1="600" y1="180" x2="650"  y2="280"/>
    <line x1="600" y1="180" x2="800"  y2="280"/>
    <line x1="600" y1="180" x2="950"  y2="280"/>
    <line x1="600" y1="180" x2="1100" y2="280"/>
    <line x1="600" y1="180" x2="1250" y2="280"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="255" x2="1200" y2="255"/>
  </g>

  <text x="600" y="130" text-anchor="middle" class="title" font-family="Consolas, monospace" font-size="34" font-weight="700" fill="#ffffff" filter="url(#glow)" letter-spacing="6">PASHA.DEV</text>
  <text x="600" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#00f0ff" letter-spacing="4" opacity="0.9">SYSTEM ONLINE // BUILD MODE</text>

  <rect class="scanline" x="0" y="0" width="1200" height="3" fill="#00f0ff" opacity="0.35"/>
</svg>
